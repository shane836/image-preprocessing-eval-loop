dependencies = ["numpy>=2.1,<3", "opencv-python-headless>=4.10,<5", "mcp>=1.20,<2", "python-dotenv>=1,<2", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
